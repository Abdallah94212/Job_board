<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tremplin - Mon compte</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">T</span> Tremplin</a>
      <nav class="nav-links">
        <a href="index.html">Offres</a>
      </nav>
      <a href="connexion.html" class="btn btn-primary btn-small user-chip" id="nav-user">Se connecter</a>
    </div>
  </header>

  <main class="container auth-page">
    <section class="card auth-card">
      <h2 id="account-title">Créer un compte</h2>
      <p class="subtitle">Ces informations remplissent vos candidatures.</p>

      <form id="account-form">
        <div class="field">
          <label for="first-name">Prénom</label>
          <input type="text" id="first-name" name="first_name" required>
        </div>
        <div class="field">
          <label for="last-name">Nom</label>
          <input type="text" id="last-name" name="last_name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="phone">Téléphone (facultatif)</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="field">
          <label for="password" id="password-label">Mot de passe (8 caractères minimum)</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </div>

        <p class="form-message"></p>
        <button type="submit" class="btn btn-primary btn-full">Enregistrer</button>
      </form>

      <button type="button" class="btn btn-light btn-full" id="logout-button" hidden>Se déconnecter</button>
    </section>
  </main>

  <footer>
    <p>© 2026 Tremplin - Projet Epitech</p>
  </footer>

  <script src="api.js"></script>
  <script src="compte.js"></script>
</body>

</html>
