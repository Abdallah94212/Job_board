<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tremplin - Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <span class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <rect x="2" y="12" width="4" height="8" rx="1" fill="white" />
            <rect x="9" y="7" width="4" height="13" rx="1" fill="white" />
            <rect x="16" y="10" width="4" height="10" rx="1" fill="white" />
            <circle cx="18" cy="4" r="2.5" fill="#ffc845" />
          </svg>
        </span>
        Tremplin
      </a>
      <nav class="nav-links">
        <a href="index.html">Offres</a>
        <a href="entreprises.html">Entreprises</a>
      </nav>
    </div>
  </header>

  <main class="container auth-page">
    <section class="card auth-card">
      <!-- Les deux onglets : on passe de l'un à l'autre sans recharger la page -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-target="login-form">Se connecter</button>
        <button type="button" class="auth-tab" data-target="register-form">Créer un compte</button>
      </div>

      <!-- Formulaire de connexion -->
      <form id="login-form" class="auth-form">
        <h2>Bon retour !</h2>
        <p class="subtitle">Connectez-vous pour suivre vos candidatures.</p>

        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </div>

        <p class="form-message" role="status"></p>
        <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
      </form>

      <!-- Formulaire de création de compte (caché au départ) -->
      <form id="register-form" class="auth-form" hidden>
        <h2>Créer un compte</h2>
        <p class="subtitle">Vos infos rempliront automatiquement vos candidatures.</p>

        <div class="form-row">
          <div class="field">
            <label for="register-last-name">Nom</label>
            <input type="text" id="register-last-name" autocomplete="family-name" required>
          </div>
          <div class="field">
            <label for="register-first-name">Prénom</label>
            <input type="text" id="register-first-name" autocomplete="given-name" required>
          </div>
        </div>
        <div class="field">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="register-password">Mot de passe (8 caractères minimum)</label>
          <input type="password" id="register-password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="register-confirm">Confirmer le mot de passe</label>
          <input type="password" id="register-confirm" autocomplete="new-password" minlength="8" required>
        </div>

        <p class="form-message" role="status"></p>
        <button type="submit" class="btn btn-primary btn-full">Créer mon compte</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Tremplin - Projet Epitech</p>
  </footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
</body>

</html>
