<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tremplin - Connexion</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">T</span> Tremplin</a>
      <nav class="nav-links">
        <a href="index.html">Offres</a>
      </nav>
    </div>
  </header>

  <main class="container auth-page">
    <section class="card auth-card">
      <form id="login-form">
        <h2>Bon retour !</h2>
        <p class="subtitle">Une fois connecté, vos informations remplissent vos candidatures.</p>

        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required>
        </div>
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" required>
        </div>

        <p class="form-message"></p>
        <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
      </form>

      <p class="auth-link">Pas encore de compte ? <a href="compte.html">Créer un compte</a></p>
    </section>
  </main>

  <footer>
    <p>© 2026 Tremplin - Projet Epitech</p>
  </footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
</body>

</html>
