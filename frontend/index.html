<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tremplin - Offres</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><span class="logo-icon">T</span> Tremplin</a>
      <nav class="nav-links">
        <a href="index.html" class="active">Offres</a>
        <a href="entreprises.html">Entreprises</a>
      </nav>
      <a href="connexion.html" class="btn btn-primary btn-small user-chip" id="nav-user">Se connecter</a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <div>
        <h1>Trouvez votre prochain job</h1>
        <p id="ads-count">Chargement...</p>
      </div>
    </div>
  </section>

  <main class="container">
    <div class="list-header">
      <h2 class="section-title" id="ads-title">Les annonces</h2>
      <a href="index.html" class="show-all" id="show-all" hidden>Voir toutes les offres</a>
    </div>

    <div class="offers-grid" id="ads-list">
      <p class="form-message info">Chargement des annonces...</p>
    </div>

    <template id="ad-template">
      <article class="ad-card">
        <div class="ad-company">
          <span class="initial"></span>
          <p><span class="ad-company-name"></span><br><span class="ad-category"></span></p>
        </div>
        <h3></h3>
        <p class="ad-short"></p>

        <div class="ad-footer">
          <button type="button" class="btn btn-outline btn-small btn-more">Learn more</button>
          <button type="button" class="btn btn-primary btn-small btn-apply">Postuler</button>
        </div>

        <div class="ad-details" hidden>
          <p class="form-message"></p>
          <div class="details-list" hidden>
            <p><strong>Entreprise :</strong> <span class="detail-company"></span></p>
            <p><strong>Catégorie :</strong> <span class="detail-category"></span></p>
            <p><strong>Description :</strong> <span class="detail-description"></span></p>
            <p><strong>Lieu :</strong> <span class="detail-location"></span></p>
            <p><strong>Temps de travail :</strong> <span class="detail-working-time"></span></p>
            <p><strong>Salaire :</strong> <span class="detail-salary"></span></p>
            <p><strong>Responsable :</strong> <span class="detail-contact"></span></p>
          </div>
        </div>

        <form class="apply-form" hidden>
          <h4>Postuler à cette offre</h4>
          <div class="field">
            <label>Prénom <input type="text" name="first_name" required></label>
          </div>
          <div class="field">
            <label>Nom <input type="text" name="last_name" required></label>
          </div>
          <div class="field">
            <label>Email <input type="email" name="email" required></label>
          </div>
          <div class="field">
            <label>Téléphone (facultatif) <input type="tel" name="phone"></label>
          </div>
          <div class="field">
            <label>Message <textarea name="message" rows="4" required></textarea></label>
          </div>
          <p class="form-message"></p>
          <button type="submit" class="btn btn-primary btn-full">Envoyer ma candidature</button>
        </form>
      </article>
    </template>
  </main>

  <footer>
    <p>© 2026 Tremplin - Projet Epitech</p>
  </footer>

  <script src="api.js"></script>
  <script src="script.js"></script>
</body>

</html>
